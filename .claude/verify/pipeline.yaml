# Pipeline de verificação — fonte única dos stages (Onda 1 da Estrutura Agêntica).
#
# Consumido por run.sh, pelo hook Stop (post-turn-verify, com --light --no-mutate)
# e pelo CI (.github/workflows/verify.yml). Checagem nova entra AQUI, nunca no
# prompt de um agente. Campos por stage:
#   desc     — o que o stage garante
#   run      — comando, executado na raiz do repositório
#   parallel — true: roda no grupo concorrente (stages independentes entre si)
#   mutates  — true: regenera arquivos (pulado com --no-mutate)
#   heavy    — true: caro (pulado com --light; o hook Stop usa --light)
#
# Fora do pipeline local (registrado em known_issues.json KI-3): suítes visuais
# Chromium — job próprio no CI e rito manual do proprietário. Ondas seguintes
# adicionam: state (planning-state, Onda 2), tdd e mutation-trigger (Onda 3).

stages:
  env-doctor:
    desc: "Toolchain presente e sã antes de qualquer verificação (FAIL aborta o pipeline)"
    run: python .claude/verify/env_doctor.py
    parallel: false
    mutates: false
    heavy: false
  baseline:
    desc: "Registry de pins × blobs de HEAD — à prova de CRLF/plataforma; arquivo novo sem pin = FAIL"
    run: python .claude/verify/check_baseline.py
    parallel: true
    mutates: false
    heavy: false
  boundary:
    desc: "Manifesto de boundary coerente: protegidos existem, pinados, e divergência nomeia o rito violado"
    run: python .claude/verify/check_boundary.py
    parallel: true
    mutates: false
    heavy: false
  marker-lint:
    desc: "Cada marcador V32_* exatamente 1x no HTML (exceções nominais com remoção prevista em known_issues)"
    run: python .claude/verify/check_markers.py
    parallel: true
    mutates: false
    heavy: false
  icons-check:
    desc: "Gerador de ícones reproduz ui_icons_v32.js byte a byte (verificação sem escrita)"
    run: python generate_icons_v32.py --check
    parallel: true
    mutates: false
    heavy: false
  build:
    desc: "Builder reproduz o HTML publicado byte a byte, em diretório efêmero, sem sujar a árvore"
    run: python .claude/verify/check_build.py
    parallel: true
    mutates: false
    heavy: false
  lint-arch:
    desc: "Pureza do engine (zero DOM) · innerHTML= proibido e IIFE exigido em módulo novo (ui_p5* + ui_d0*) · bridges registrados"
    run: python .claude/verify/check_lint_arch.py
    parallel: true
    mutates: false
    heavy: false
  regra-morta:
    desc: "Regra morta por cascata: nenhum mutante de CSS ataca declaração que perde em todos os contextos; indecidíveis nomeados e contados"
    run: node tests_014_regra_morta.js
    parallel: true
    mutates: false
    heavy: false
  state:
    desc: "planning-state de demandas em curso válido contra o schema; fases pós-red exigem red provado ou waiver"
    run: python .claude/verify/check_state.py
    parallel: true
    mutates: false
    heavy: false
  tdd:
    desc: "Regime red-first auditável: red.commit existe; done tem conformance; waivers listados; matriz gate-mutante íntegra"
    run: python .claude/verify/check_tdd.py
    parallel: true
    mutates: false
    heavy: false
  fecho:
    desc: "P16.a pós-merge: demanda mesclada em origin/develop sem Fase 6 fechada (FEC1), feature/NNN mesclada após o piso sem planning-state ou fora de PR (FEC2), done sem artefatos salvo exclusão R13 impressa (FEC3), válvula fecho_pendente julgada contra a data do commit (FEC4) — sem rede; sonda de 33 casos pinada antes da árvore (C7). Direção pré-merge é o job `fecho` do CI"
    run: python .claude/verify/check_fecho.py
    parallel: true
    mutates: false
    heavy: false
  mutation:
    desc: "Campanhas de mutação por trigger de path (mutation_map.json); harness exigido sem ambiente = FAIL nomeado"
    run: python .claude/verify/check_mutation.py
    parallel: false
    mutates: false
    heavy: true
  m41:
    desc: "Harness M41: payload funcional PASS contra o snapshot e SHA-256 == pin declarado (régua D2)"
    run: python .claude/verify/check_m41.py
    parallel: false
    mutates: false
    heavy: false
  suites:
    desc: "Todas as suítes node × contagens canônicas (expected_suites.json); suíte fora do registro = FAIL"
    run: python .claude/verify/check_suites.py
    parallel: false
    mutates: false
    heavy: true
  suites-heavy:
    desc: "Suíte de sessão (97 gates, heap 4608 MB) × contagem canônica"
    run: python .claude/verify/check_suites.py --heavy
    parallel: false
    mutates: false
    heavy: true
  evidence-bridge:
    desc: "Manifesto-ponte fiel ao commit-âncora, 7 acervos migrados fora do índice, assets dos releases íntegros (sem rede: WARN nomeado local, FAIL no CI)"
    run: python .claude/verify/check_evidence_bridge.py
    parallel: false
    mutates: false
    heavy: true
