# CI Linux — plataforma canônica do pipeline de verificação (Onda 1, Q2).
#
# O job `verify` roda o pipeline completo (incl. suítes node e session) em
# ubuntu — resolve "determinismo comprovado apenas em Linux" sem WSL manual.
# O job `visual` (Chromium/Playwright) fica em workflow_dispatch até ser
# calibrado contra o baseline visual do proprietário (known_issues KI-3):
# screenshots dependem do browser exato e um required check vermelho por
# infra não calibrada bloquearia merges legítimos.
name: verify

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      visual:
        description: "Rodar também as suítes visuais (Chromium)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo: o stage tdd valida red.commit por sha e o
                           # check_mutation usa merge-base — checkout raso quebra ambos
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar dependências (engine-strict — CI é a plataforma canônica)
        run: npm ci --engine-strict --no-audit --no-fund
      - name: Pipeline de verificação (completo)
        run: bash .claude/verify/run.sh
        env:
          MUTATION_DEFER_MISSING: "1"   # campanha chromium exigida é delegada ao job visual
      - name: Auditoria de conformidade da configuração agêntica
        run: bash .claude/verify/compliance-audit.sh

  visual:
    # Promovido na Onda 4 (calibração fechada na 6ª rodada: 67/37 + 27/27 + 44/44 +
    # campanha p52 72/72 por trigger). Roda em PR/push; dispatch segue disponível.
    if: github.event_name != 'workflow_dispatch' || inputs.visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo: o stage tdd valida red.commit por sha e o
                           # check_mutation usa merge-base — checkout raso quebra ambos
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --engine-strict --no-audit --no-fund
      - name: Instalar Chromium gerenciado do Playwright + ferramentas de PDF
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          # poppler (pdftoppm/pdftotext/pdfinfo): exigido pelo preflight canônico
          # das suítes de print — 1ª calibração falhou exatamente nisso (3 gates)
      - name: Suítes visuais (playwright + chromium P50/P52/D011)
        run: |
          npm run test:visual
          node tests_p50_chromium.js
          node tests_p52_chromium.js
          node tests_011_chromium.js
      - name: Restaurar árvore (suítes chromium legadas regravam evidência rastreada)
        # Follow-up registrado: tests_p50_chromium reescreve docs_phase5/evidence_p50/*.json
        # como efeito colateral (achado E9; a suíte é congelada — correção é demanda própria).
        # No CI os bytes regravados são descartáveis: o repositório é a fonte.
        run: git checkout -- docs_phase5/ 2>/dev/null || true
      - name: Campanhas de mutação com Chromium (deferidas pelo job verify)
        run: python .claude/verify/check_mutation.py

  fecho:
    # E1 da spec 016: check PRÓPRIO, não passo do `verify`. Um `verify` vermelho a
    # demanda inteira ensina que vermelho é normal (EA-5); este check vermelho diz
    # algo verdadeiro: "a demanda ainda não fechou". Sem `needs:` e sem `if:` —
    # fora de PR de demanda ele RODA e responde `NÃO JULGADO (<motivo>)` (R10 §2).
    # Direção pós-merge (stage `fecho` do pipeline.yaml) roda no job `verify`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fecho da demanda antes do merge (D016-PR1 — P16.a)
        run: python .claude/verify/check_fecho.py --pr
